[package]
name = "vidl"
version = "0.1.0"
edition = "2021"
description = "Drive yt-dlp: classify a URL, resolve per-video subtitles, download, and patch the result"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
lofty = "0.24"          # in-place audio metadata writes — the subtitle tags on `--audio` downloads
software_inventory = { git = "https://github.com/SirHexa10t/software_inventory.git", branch = "main" }   # where installed browsers keep their cookie stores, for `--cookies-extract-for-domain`

# Its own workspace root: `vidl` is an independent repo that bashrs happens to keep beside it
# as a path dependency, so it must build exactly as it will once moved away.
[workspace]
